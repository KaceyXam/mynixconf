[osd]
position = "top_right"

[plugins]
enabled = []

[shell]
font_family = "JetBrainsMono NF"

    [shell.launcher]
    layout = "simple"

    [shell.panel]
    wallpaper_position = "center"

[theme]
builtin = "Kanagawa"
mode = "dark"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/kxkniffen/Wallpapers"

    [wallpaper.default]
    path = "/home/kxkniffen/Wallpapers/mountain-night-wallpaper_scaled.jpg"

    [wallpaper.last]
    path = "/home/kxkniffen/Wallpapers/mountain-night-wallpaper_scaled.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/kxkniffen/Wallpapers/mountain-night-wallpaper_scaled.jpg"

